name: Проверки

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  tests:
    name: Тесты и сборка
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd — ресайз снимков, sqlite — база тестов.
          extensions: gd, sqlite3, pdo_sqlite, mbstring, bcmath, intl, zip
          coverage: none

      - name: Кэш composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Зависимости PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Уязвимости в зависимостях
        run: composer audit

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Зависимости фронтенда
        run: npm ci

      - name: Сборка
        run: npm run build

      - name: Окружение тестов
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Тесты
        run: php artisan test

      # Готовая сборка уезжает на деплой — держать public/build в git не нужно.
      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: public/build
          retention-days: 14
