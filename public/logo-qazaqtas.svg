  <path d="M30 140 C 62 126, 86 154, 118 138 S 166 132, 166 132" fill="none"
        stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <text x="96" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
